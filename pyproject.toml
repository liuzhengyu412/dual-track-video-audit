[project]
name = "dual-track-video-audit"
version = "0.4.0"
description = "Configurable visual and audio review pipeline for local video files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "dashscope>=1.24.6,<2",
  "requests>=2.31,<3",
  "imageio-ffmpeg>=0.6,<1",
  "openpyxl>=3.1,<4",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
